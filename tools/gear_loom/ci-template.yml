name: Gear Loom gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mechanical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/gear_loom/smoke.py
      - run: python -O tools/gear_loom/smoke.py
