<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>X3D Ontology Constellation 4.1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0e14;--p1:#10151f;--p2:#161c29;--ln:#232c3d;--tx:#d7deea;--mu:#7d8aa3;--ac:#5ad1ff;--mg:#ff6bd6;--gn:#5be39a;--rd:#ff6b6b;--am:#ffc857;font:12px/1.45 ui-sans-serif,-apple-system,"Inter",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:#12324a;border-color:var(--ac);color:#fff}

#top h1{font-size:13px;margin:0 8px 0 0;letter-spacing:.08em;text-transform:uppercase;font-weight:600}#top h1 b{color:var(--ac)}
#q{width:170px}#top button{padding:3px 6px}#simban{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#3a0f33dd;border:1px solid #ff6bd6;color:#ffd0f3;border-radius:8px;padding:3px 12px;font-size:11px;display:none;pointer-events:none;letter-spacing:.04em}.grp{display:flex;gap:4px;align-items:center;padding-left:8px;border-left:1px solid var(--ln)}.grp label{color:var(--mu);margin-right:2px}
#left{background:var(--p1);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#lt{padding:6px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
#list{overflow:auto;flex:1}.row{display:grid;grid-template-columns:10px 1fr 34px 34px;gap:6px;padding:2px 8px;cursor:pointer;align-items:center;border-bottom:1px solid #121826}
.row:hover{background:var(--p2)}.row.sel{background:#12324a}.row i{width:8px;height:8px;border-radius:50%;display:block}.row span.n{font-size:11px;color:var(--mu);text-align:right}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm.ab{font-style:italic;color:#aab6cc}
#mid{position:relative;min-width:0;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#mini{position:absolute;right:10px;bottom:10px;width:170px;height:170px;border:1px solid var(--ln);background:#0b0e14cc;border-radius:8px}
#legend{position:absolute;left:10px;bottom:10px;background:#0b0e14cc;border:1px solid var(--ln);border-radius:8px;padding:6px 8px;max-width:420px;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px}
#legend span{display:flex;gap:4px;align-items:center;cursor:pointer}#legend i{width:9px;height:9px;border-radius:50%}

#tabs{display:flex;border-bottom:1px solid var(--ln)}#tabs button{font-size:11px;flex:1;border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;padding:7px 2px}
#tabs button.on{border-bottom-color:var(--ac);background:var(--p2)}#insp{overflow:auto;padding:10px;flex:1}
#bot{grid-column:1/4;background:var(--p1);border-top:1px solid var(--ln);display:flex;gap:16px;align-items:center;padding:0 10px;color:var(--mu);overflow:hidden;white-space:nowrap}#bot b{color:var(--tx);font-weight:600}
h2{font-size:15px;margin:0 0 2px}h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:12px 0 4px;font-weight:600}
.chip{display:inline-block;padding:1px 7px;margin:1px 2px 1px 0;border:1px solid var(--ln);border-radius:10px;cursor:pointer;background:var(--p2);font-size:11px}.chip:hover{border-color:var(--ac)}
.chip.a{border-color:#2b6a86}.chip.c{border-color:#8a3a78}.tag{font-size:10px;padding:0 6px;border-radius:4px;background:#1d2a3d;color:#9fc7ff;margin-left:4px}
.tag.C{background:#12331f;color:var(--gn)}.tag.L{background:#3a2f10;color:var(--am)}
table{border-collapse:collapse;width:100%}td,th{padding:2px 6px;border-bottom:1px solid #151c2b;text-align:left;vertical-align:top;font-size:11px}th{color:var(--mu);font-weight:500}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#1a2233}.bar i{display:block}
.defn{color:#b9c4d8;font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
pre{background:#0a0d13;border:1px solid var(--ln);border-radius:6px;padding:8px;overflow:auto;margin:4px 0;max-height:260px;font-size:11px}

.kb{display:inline-block;border:1px solid var(--ln);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--p2);font-family:ui-monospace,monospace;font-size:11px}
</style></head><body>
<div id="app">
 <div id="top"><h1><b>X3D</b> Ontology Constellation</h1>
  <input id="q" placeholder="search class, field, text  ( / )">
  <div class="grp"><label>lens</label><select id="lens"><option value="fam">family</option><option value="comp">X3D component</option><option value="depth">depth</option><option value="fields">field count</option><option value="lp">legal-parent count</option><option value="kind">kind</option><option value="ver">4.1 vs 4.0</option><option value="xsd">XSD acceptance</option></select></div>
  <div class="grp"><label>overlays</label>
   <button data-ov="hier" class="on" title="H">hierarchy</button><button data-ov="multi" title="M">multi-parent</button><button data-ov="cont" class="on" title="C">containment</button>
   <button data-ov="xchk" class="on" title="X">cross-check</button><button data-ov="rings" title="R">rings</button><button data-ov="lab" class="on" title="L">labels</button><button data-ov="sim" title="S" style="border-color:#8a3a78">sc: SIM</button></div>
  <div class="grp"><button id="bq" title="Q">SPARQL</button><button id="bm" title="T">MCP</button><button id="bmx" title="G">XSD matrix</button><button id="bs">sc: SIM</button><button id="bl">Ladder</button><button id="bx">Cross-check</button><button id="bh" title="?">?</button></div></div>
 <div id="left"><div id="lt"><button data-s="name" class="on">name</button><button data-s="d">depth</button><button data-s="nf">fields</button><button data-s="lp">parents</button>
  <button data-k="concrete" class="on">concrete</button><button data-k="abstract" class="on">abstract</button><button data-k="other" class="on">other</button></div><div id="list"></div></div>
 <div id="mid"><canvas id="cv"></canvas><canvas id="mini"></canvas><div id="hint">drag to pan · wheel to zoom · click a node · <span class="kb">?</span> help</div><div id="legend"></div><div id="simban">SIMULATED sc: overlay · not Dr. Polys's ontology · grade S</div></div>
 <div id="right"><div id="tabs"><button data-t="ov" class="on">Overview</button><button data-t="fl">Fields</button><button data-t="ct">Containment</button><button data-t="mcp">MCP</button><button data-t="sc" style="color:#e58bd0">sc: SIM</button><button data-t="pv">Prov.</button></div><div id="insp"></div></div>
 <div id="bot"></div>
</div>
<div id="tip"></div><div id="modal"><div id="mbox"><button id="mx">close (Esc)</button><div id="mc"></div></div></div>
<script>
const D=/*DATA*/null;
const N=Object.fromEntries(D.nodes.map(n=>[n.id,n]));const kids={};D.nodes.forEach(n=>n.par.forEach(p=>(kids[p]=kids[p]||[]).push(n.id)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fams=Object.keys(D.families).sort((a,b)=>D.families[b]-D.families[a]);const famCol={};fams.forEach((f,i)=>famCol[f]=`hsl(${(i*137.5)%360} 70% 62%)`);
const simSet=new Set(D.sim.stats.grounded_nodes),U_={Y:' <small style="color:#7aa7ff" title="X3DUOM acceptableNodeTypes allows">U✓</small>',N:' <small style="color:#b583ff" title="X3DUOM acceptableNodeTypes denies">U✗</small>'},VC={A:"#5be39a",R:"#ff6b6b",I:"#ffc857","-":"#5ad1ff"};
const comps=[...new Set(D.nodes.map(n=>n.comp).filter(Boolean))].sort();const compCol={};comps.forEach((c,i)=>compCol[c]=`hsl(${(i*47)%360} 65% 60%)`);
const ramp=t=>`hsl(${240-240*t} 80% ${45+15*t}%)`;
const maxNf=Math.max(...D.nodes.map(n=>n.nf)),maxLp=Math.max(...D.nodes.map(n=>n.lp.length)),maxD=D.stats.max_depth;
const S={sel:null,hov:null,lens:"fam",ov:{hier:1,multi:0,cont:1,xchk:1,rings:0,lab:1,sim:0},tab:"ov",q:"",sort:"name",kinds:{concrete:1,abstract:1,other:1},cam:{x:0,y:0,k:.5},match:null};
const colOf=n=>{switch(S.lens){case"fam":return famCol[n.fam]||"#888";case"comp":return n.comp?compCol[n.comp]:"#556";case"depth":return ramp(n.d/maxD);case"fields":return ramp(Math.min(1,n.nf/maxNf*1.6));case"lp":return ramp(Math.min(1,n.lp.length/maxLp));case"kind":return n.kind==="concrete"?"#5ad1ff":n.kind==="abstract"?"#ffc857":"#7d8aa3";case"ver":return n.new?"#5be39a":n.chg?"#ffc857":"#3b4b6b";case"xsd":{const t=n.xa+n.xr;return t?ramp(1-n.xa/t):"#3b4b6b"}}};
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),mini=document.getElementById("mini"),mx=mini.getContext("2d");let W=0,H=0,dpr=devicePixelRatio||1;
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;mini.width=170*dpr;mini.height=170*dpr;if(!S.fitted&&W>50&&H>50){S.fitted=1;fit()}else draw()}
const toS=(x,y)=>[(x-S.cam.x)*S.cam.k+W/2,(y-S.cam.y)*S.cam.k+H/2],toW=(sx,sy)=>[(sx-W/2)/S.cam.k+S.cam.x,(sy-H/2)/S.cam.k+S.cam.y];
const rad=n=>{const b=Math.sqrt(1+n.desc)*1.6+2.2;return Math.min(16,b)};
function hood(id){if(!id)return null;const n=N[id],s=new Set([id]);n.par.forEach(p=>s.add(p));(kids[id]||[]).forEach(k=>s.add(k));n.ancs.forEach(a=>s.add(a));return s}
function draw(){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);const hd=hood(S.sel),dim=S.match||hd;
 if(S.ov.rings){cx.strokeStyle="#1a2233";cx.fillStyle="#2a3550";for(let d=1;d<=maxD+1;d++){const[r0,r1]=toS(0,0);cx.beginPath();cx.arc(r0,r1,d*150*S.cam.k,0,7);cx.stroke();cx.fillText("depth "+(d-1),r0+d*150*S.cam.k+3,r1-3)}}
 if(S.ov.hier||S.ov.multi){cx.lineWidth=1;D.nodes.forEach(n=>{const[x,y]=toS(n.x,n.y);n.par.forEach(p=>{const m=N[p],prim=n.pp===p;if(prim&&!S.ov.hier)return;if(!prim&&!S.ov.multi)return;const[x2,y2]=toS(m.x,m.y);const on=!dim||(dim.has(n.id)&&dim.has(p));cx.strokeStyle=prim?(on?"#3b4b6b":"#1a2233"):(on?"#ff6bd6aa":"#ff6bd620");cx.setLineDash(prim?[]:[4,3]);cx.beginPath();cx.moveTo(x2,y2);cx.lineTo(x,y);cx.stroke()})});cx.setLineDash([]);
  if(S.ov.hier){D.stats.roots.forEach(r=>{const[x,y]=toS(N[r].x,N[r].y),[o,p]=toS(0,0);cx.strokeStyle="#1d2638";cx.beginPath();cx.moveTo(o,p);cx.lineTo(x,y);cx.stroke()});const[o,p]=toS(0,0);cx.fillStyle="#2a3550";cx.beginPath();cx.arc(o,p,3,0,7);cx.fill();if(S.cam.k>.35){cx.fillStyle="#44506b";cx.fillText("virtual layout root (not in ontology)",o+6,p+12)}}}
 if(S.ov.cont&&S.sel){const n=N[S.sel],[x,y]=toS(n.x,n.y);const arc=(m,col)=>{const[x2,y2]=toS(m.x,m.y);const mx_=(x+x2)/2,my=(y+y2)/2,dx=x2-x,dy=y2-y,l=Math.hypot(dx,dy)||1;cx.strokeStyle=col;cx.beginPath();cx.moveTo(x,y);cx.quadraticCurveTo(mx_-dy*.18,my+dx*.18,x2,y2);cx.stroke()};
  cx.lineWidth=1.2;n.lp.forEach(([d],i)=>arc(N[d],VC[n.lpv[i]||"-"]+"88"));const seen=new Set();(D.nodes.find(z=>z.id===S.sel)&&Object.keys(conts(S.sel))).forEach(k=>{if(!seen.has(k)){seen.add(k);arc(N[k],"#ff6bd655")}});cx.lineWidth=1}
 D.nodes.forEach(n=>{const[x,y]=toS(n.x,n.y);if(x<-30||y<-30||x>W+30||y>H+30)return;const r=rad(n)*Math.max(.55,Math.min(1.8,S.cam.k*1.3));let a=1;if(dim&&!dim.has(n.id))a=.18;
  if(S.ov.xchk&&D.xcheck.table[n.id]){const t=D.xcheck.table[n.id],tot=t[0],R=r+5;let a0=-Math.PI/2;[[t[1],"#5be39a"],[t[2],"#ff6b6b"],[t[3],"#ffc857"]].forEach(([v,c])=>{const a1=a0+v/tot*Math.PI*2;cx.strokeStyle=c;cx.lineWidth=3;cx.globalAlpha=a;cx.beginPath();cx.arc(x,y,R,a0,a1-.02);cx.stroke();a0=a1});cx.lineWidth=1}
  cx.globalAlpha=a;cx.fillStyle=colOf(n);cx.beginPath();if(n.kind==="abstract"){cx.rect(x-r,y-r,2*r,2*r)}else cx.arc(x,y,r,0,7);cx.fill();
  if(n.id===S.sel||n.id===S.hov){cx.strokeStyle="#fff";cx.lineWidth=2;cx.stroke();cx.lineWidth=1}
  if(S.ov.sim&&simSet.has(n.id)){cx.strokeStyle="#ff6bd6";cx.lineWidth=1.5;cx.beginPath();const q=r+7;cx.moveTo(x,y-q);cx.lineTo(x+q,y);cx.lineTo(x,y+q);cx.lineTo(x-q,y);cx.closePath();cx.stroke();cx.lineWidth=1}
  cx.globalAlpha=1});
 if(S.ov.lab){const cand=[];D.nodes.forEach(n=>{const[x,y]=toS(n.x,n.y);if(x<0||y<0||x>W||y>H)return;const imp=n.id===S.sel||n.id===S.hov||(dim&&dim.has(n.id)&&S.match)||(hd&&hd.has(n.id));const show=imp||(S.cam.k>1.3)||(S.cam.k>.7&&n.desc>3)||(S.cam.k>.3&&n.d<=1);if(!show)return;if(dim&&!dim.has(n.id))return;cand.push({n,x,y,imp,pri:(n.id===S.sel||n.id===S.hov?1e6:imp?1e5:0)+n.desc+(n.kind==="concrete"?0:1)})});
  cand.sort((a,b)=>b.pri-a.pri);const placed=[];cx.textBaseline="middle";cand.forEach(c=>{cx.font=(c.imp?"600 ":"")+"11px ui-sans-serif,sans-serif";const w=cx.measureText(c.n.id).width,r=rad(c.n)*Math.max(.55,Math.min(1.8,S.cam.k*1.3)),bx=c.x+r+3,by=c.y-7,bw=w,bh=14;if(!c.imp&&placed.some(q=>bx<q[0]+q[2]+2&&bx+bw+2>q[0]&&by<q[1]+q[3]&&by+bh>q[1]))return;placed.push([bx,by,bw,bh]);cx.fillStyle=c.imp?"#fff":"#aab6cc";cx.fillText(c.n.id,bx,c.y+1)});cx.textBaseline="alphabetic"}
 drawMini()}
function drawMini(){const w=170,h=170;mx.setTransform(dpr,0,0,dpr,0,0);mx.clearRect(0,0,w,h);const R=(maxD+1)*150+60,sc=(w/2-4)/R;D.nodes.forEach(n=>{mx.fillStyle=colOf(n);mx.fillRect(w/2+n.x*sc-1,h/2+n.y*sc-1,2,2)});const[a,b]=toW(0,0),[c,d]=toW(W,H);mx.strokeStyle="#fff";mx.strokeRect(w/2+a*sc,h/2+b*sc,(c-a)*sc,(d-b)*sc)}
function conts(id){const o={};D.nodes.forEach(n=>n.lp.forEach(([d,f])=>{if(d===id)(o[n.id]=o[n.id]||[]).push(f)}));return o}
function pick(sx,sy){let best=null,bd=1e9;D.nodes.forEach(n=>{const[x,y]=toS(n.x,n.y),d=Math.hypot(x-sx,y-sy),r=rad(n)*Math.max(.55,Math.min(1.8,S.cam.k*1.3))+4;if(d<r&&d<bd){bd=d;best=n.id}});return best}
let drag=null,fly=null;
cv.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y,moved:false}});
addEventListener("mouseup",e=>{if(drag&&!drag.moved){const r=cv.getBoundingClientRect(),id=pick(e.clientX-r.left,e.clientY-r.top);if(e.target===cv)select(id,false)}drag=null});
cv.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;S.cam.x=drag.cx-dx/S.cam.k;S.cam.y=drag.cy-dy/S.cam.k;draw();return}
 const id=pick(sx,sy);if(id!==S.hov){S.hov=id;draw()}const t=document.getElementById("tip");if(id){const n=N[id];t.style.display="block";t.style.left=Math.min(innerWidth-340,e.clientX+14)+"px";t.style.top=Math.min(innerHeight-120,e.clientY+14)+"px";t.innerHTML=`<b style="color:${colOf(n)}">${esc(n.id)}</b> <span class="tag">${n.kind}</span>${n.comp?`<span class="tag">${esc(n.comp)} L${n.lvl}</span>`:""}<div class="mono" style="color:var(--mu)">depth ${n.d} · ${n.nf} fields · ${n.lp.length} parent pairs · ${n.desc} descendants</div><div class="defn">${esc(n.defn.slice(0,170))}${n.defn.length>170?"…":""}</div>`}else t.style.display="none"});
cv.addEventListener("mouseleave",()=>{document.getElementById("tip").style.display="none"});
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,[wx,wy]=toW(sx,sy),f=Math.exp(-e.deltaY*.0015);S.cam.k=Math.max(.12,Math.min(8,S.cam.k*f));const[nx,ny]=toW(sx,sy);S.cam.x+=wx-nx;S.cam.y+=wy-ny;draw()},{passive:false});
cv.addEventListener("dblclick",()=>fit());
mini.addEventListener("click",e=>{const r=mini.getBoundingClientRect(),R=(maxD+1)*150+60,sc=(85-4)/R;S.cam.x=(e.clientX-r.left-85)/sc;S.cam.y=(e.clientY-r.top-85)/sc;draw()});
function fit(){const R=(maxD+1)*150+80;S.cam.x=0;S.cam.y=0;S.cam.k=Math.min(W,H)/2/R*1.0;draw()}
function flyTo(id){const n=N[id],k1=Math.max(S.cam.k,.9),x0=S.cam.x,y0=S.cam.y,k0=S.cam.k,t0=performance.now();cancelAnimationFrame(fly);const f=t=>{const u=Math.min(1,(t-t0)/450),e=1-Math.pow(1-u,3);S.cam.x=x0+(n.x-x0)*e;S.cam.y=y0+(n.y-y0)*e;S.cam.k=k0+(k1-k0)*e;draw();if(u<1)fly=requestAnimationFrame(f)};fly=requestAnimationFrame(f)}
function select(id,fly_){S.sel=id;if(fly_&&id)flyTo(id);else draw();renderList();renderInsp();renderBot()}
// left list
function renderList(){const q=S.q.toLowerCase();let rows=D.nodes.filter(n=>S.kinds[n.kind]);if(S.match)rows=rows.filter(n=>S.match.has(n.id));const k=S.sort;rows.sort((a,b)=>k==="name"?a.id.localeCompare(b.id):(b[k]===undefined?0:(k==="lp"?b.lp.length-a.lp.length:b[k]-a[k]))||a.id.localeCompare(b.id));
 document.getElementById("list").innerHTML=rows.map(n=>`<div class="row${n.id===S.sel?" sel":""}" data-id="${n.id}"><i style="background:${colOf(n)}"></i><span class="nm${n.kind==="abstract"?" ab":""}">${esc(n.id)}</span><span class="n" title="fields">${n.nf}</span><span class="n" title="legal parent pairs">${n.lp.length}</span></div>`).join("")||`<div style="padding:10px;color:var(--mu)">no match</div>`;
 const sel=document.querySelector(".row.sel");if(sel)sel.scrollIntoView({block:"nearest"})}
document.getElementById("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)select(r.dataset.id,true)});

function renderInsp(){const el=document.getElementById("insp");if(!S.sel){el.innerHTML=`<h2>Select a class</h2><div class="defn" style="margin-bottom:6px"><b>X3D Ontology 4.1</b> (29 Sep 2026 draft). XSD verdict run on all ${D.xcheck.all.pairs.toLocaleString()} concrete pairs: <span style="color:var(--gn)">${D.xcheck.all.A.toLocaleString()} accepted</span>, <span style="color:var(--rd)">${D.xcheck.all.R.toLocaleString()} rejected</span>, <span style="color:var(--am)">${D.xcheck.all.I.toLocaleString()} inconclusive</span>.</div><h3>New in 4.1</h3>${D.delta.new.map(x=>chip(x)).join("")}<h3 style="margin-top:6px">Overview</h3><div class="defn">${D.stats.classes} classes · ${D.stats.datatype_props} datatype and ${D.stats.object_props} object properties · ${D.stats.triples.toLocaleString()} triples. Click a node, a list row, or press <span class="kb">/</span> to search.</div><h3>Families</h3>${fams.slice(0,18).map(f=>`<span class="chip" data-go="${esc(f)}" style="border-color:${famCol[f]}">${esc(f)} ${D.families[f]}</span>`).join("")}`;return}

 if(T==="fl"){const fs=n.fields;h+=`<h3>${fs.length} fields declared directly <span class="tag C">computed</span></h3><div class="defn" style="color:var(--mu)">Excludes universal ${["DEF","USE","hasIS","hasMetadata","class","id","style"].join(", ")}. Inherited fields appear on ancestors. Default values are pooled per property across all classes that declare it.</div><table><tr><th>field</th><th>kind</th><th>range</th><th>access</th><th>default</th></tr>${fs.map(f=>{const p=D.props[f]||{};return`<tr><td class="mono">${esc(f)}${p.child?` <span class="tag">child</span>`:""}</td><td>${p.kind||""}</td><td class="mono">${(p.range||[]).map(esc).join(", ")}</td><td>${(p.access||[]).map(a=>`<span class="tag">${a}</span>`).join("")}</td><td class="mono" title="${p.ndflt>1?"pooled across classes":""}">${(p.dflt||[]).slice(0,2).map(esc).join(" | ")}${p.ndflt>2?" …":""}</td></tr>`}).join("")}</table>`}
  if(T==="ct"){const byp={};n.lp.forEach(([d,f],k)=>(byp[d]=byp[d]||[]).push([f,n.lpv[k],n.lpu[k]]));const c=conts(n.id);const ck=Object.keys(c).sort();const dot=v=>`<span style="color:${VC[v]}" title="${{A:"XSD accepts",R:"XSD rejects",I:"inconclusive","-":"not tested (abstract parent)"}[v]}">●</span>`;h+=`<h3 style="color:var(--ac)">May be placed in (${n.lp.length} parent·field pairs, ${Object.keys(byp).length} parents)</h3><div class="defn" style="color:var(--mu)">What <span class="mono">node_parents</span> returns, with the XSD's verdict: <span style="color:var(--gn)">● accepts</span> <span style="color:var(--rd)">● rejects</span> <span style="color:var(--am)">● inconclusive</span> <span style="color:var(--ac)">● abstract, untested</span>.</div>${Object.keys(byp).sort().map(d=>`<div>${chip(d,"a")} <span class="mono" style="color:var(--mu)">${byp[d].map(([f,v,v2])=>`${dot(v)}<span ${n.errs[d+"|"+f]?`title="${esc(n.errs[d+"|"+f])}"`:""}>${esc(f)}</span>${U_[v2]||""}`).join(", ")}</span> ${N[d].kind==="abstract"?'<span class="tag">abstract</span>':""}</div>`).join("")||"(none)"}<h3 style="color:var(--mg)">May contain (${ck.length} node types)</h3><div>${ck.map(k=>`<span class="chip c" data-go="${esc(k)}" title="${esc(c[k].join(", "))}">${esc(k)}</span>`).join("")||"(none)"}</div>${xbar(n.id)}`}
 if(T==="mcp"){const np={nodeType:n.id,parents:n.lp.map(([parent,field])=>({parent,field}))};const dt={term:n.id,types:["Class"],superClasses:n.par,subClasses:(kids[n.id]||[]).slice().sort()};h+=`<h3>query_ontology / node_parents / describe_ontology_term</h3><div class="defn" style="color:var(--mu)">Output shapes below are rebuilt from the data file; harness test confirms node_parents is identical to the live tool for all ${D.stats.classes} classes (see Provenance).</div><div class="mono">node_parents("${esc(n.id)}")</div><pre>${esc(JSON.stringify(np,null,1).slice(0,2200))}${JSON.stringify(np).length>2200?"\n…":""}</pre><div class="mono">describe_ontology_term("${esc(n.id)}")  <span style="color:var(--mu)">(subset)</span></div><pre>${esc(JSON.stringify(dt,null,1).slice(0,1200))}</pre><div class="mono">query_ontology(sparql)</div><pre>SELECT ?f WHERE { ?f rdfs:domain x3d:${esc(n.id)} } ORDER BY ?f</pre><div class="defn" style="color:var(--am)">Ontology answers are advisory; XSD and semantic validation remain ground truth (README, x3d_mcp).</div>`}

  if(T==="pv"){const m=D.manifest,m0=D.manifest40,S_=D.sim.stats;h+=`<h3>Data provenance</h3><table><tr><td>4.1 file</td><td class="mono">${esc(m.input.split("/").pop())} · sha256 ${m.input_sha256.slice(0,16)}…</td></tr><tr><td>matches doc manifest</td><td class="mono">SHA-1 1b5d645a… (checked at download)</td></tr><tr><td>4.0 file</td><td class="mono">${esc(m0.input.split("/").pop())} · sha256 ${m0.input_sha256.slice(0,16)}…</td></tr><tr><td>model sha256</td><td class="mono">${m.output_sha256.slice(0,24)}…</td></tr><tr><td>built (UTC)</td><td class="mono">${m.built_utc}</td></tr><tr><td>rdflib</td><td class="mono">${m.rdflib}</td></tr><tr><td>XSD run</td><td class="mono">${D.xcheck.all.pairs.toLocaleString()} pairs in ${D.xcheck.all.seconds} s</td></tr><tr><td>sim vocabulary</td><td class="mono">${S_.files} files · ${S_.triples} triples · ${S_.concepts} concepts · SIMULATED</td></tr></table><h3>Grades used here</h3><div class="defn"><span class="tag C">C</span> computed by the harness from the .ttl, or checked against the live x3d_mcp tool code<br><span class="tag C">C</span> XSD verdicts: recomputed for all pairs; the doc's 10-type table is reproduced exactly<br><span class="tag L">L</span> layout, families and lenses are display choices, not ontology facts<br><span class="tag" style="background:#3a0f33;color:#ff9bea">S</span> everything under sc: SIM is simulated<br>Cause statements (why the ontology over-predicts) remain L, as in the doc.</div>`}

function xcheck(){const T=D.xcheck.table,dt=D.xcheck.doc_table,t=D.xcheck.ten_totals,a=D.xcheck.all;openM(`<h2>Ontology vs XSD: the "map, not a gate" result</h2><div class="defn" style="color:var(--mu)">${esc(D.xcheck.src)}. Cause statements are L; the numbers are C.</div><h3>The doc's 10-type table: ${D.xcheck.reproduced?'<span class="tag C">reproduced exactly</span>':'<span class="tag" style="background:#3a1010;color:var(--rd)">differs</span>'}</h3><table><tr><th>child</th><th>predicted</th><th>accepts</th><th>rejects</th><th>inconclusive</th><th style="width:30%"></th><th>doc row</th></tr>${Object.entries(T).map(([k,[p,x,r,i]])=>`<tr><td>${chip(k)}</td><td>${p}</td><td style="color:var(--gn)">${x}</td><td style="color:var(--rd)">${r}</td><td style="color:var(--am)">${i}</td><td><div class="bar"><i style="width:${x/p*100}%;background:var(--gn)"></i><i style="width:${r/p*100}%;background:var(--rd)"></i><i style="width:${i/p*100}%;background:var(--am)"></i></div></td><td class="mono">${dt[k].join(" / ")}</td></tr>`).join("")}<tr><th>total</th><th>${t.predicted}</th><th>${t.accepts}</th><th>${t.rejects}</th><th>${t.inconclusive}</th><th></th><th>${D.xcheck.doc_totals.predicted} / ${D.xcheck.doc_totals.accepts} / ${D.xcheck.doc_totals.rejects} / ${D.xcheck.doc_totals.inconclusive}</th></tr></table><h3>Extended to every concrete node <span class="tag C">new</span></h3><div class="defn"><b>${a.pairs.toLocaleString()}</b> predicted (child, parent, field) pairs: <span style="color:var(--gn)"><b>${a.A.toLocaleString()}</b> accepted</span>, <span style="color:var(--rd)"><b>${a.R.toLocaleString()}</b> rejected</span>, <span style="color:var(--am)"><b>${a.I.toLocaleString()}</b> inconclusive</span>. Accepted share of conclusive pairs: <b>${(a.A/(a.A+a.R)*100).toFixed(1)}%</b> (10-type slice: ${(t.accepts/(t.accepts+t.rejects)*100).toFixed(1)}%). ${a.pairs.toLocaleString()} validations took ${a.seconds} s. Inconclusive pairs are mostly harness placement failures, as in the doc's run.</div><h3>A closed-world oracle already exists: X3DUOM <span class="mono">acceptableNodeTypes</span> <span class="tag C">new</span></h3><div class="defn">Each SFNode/MFNode field in X3DUOM lists the node types it accepts (Gain.children names 21 audio nodes). Testing every pair against that list, with the child's ontology ancestors expanded, agrees with the XSD verdict on <b>${(D.uom.agreement*100).toFixed(1)}%</b> of the ${(D.uom.confusion.uom_yes_xsd_accepts+D.uom.confusion.uom_yes_xsd_rejects+D.uom.confusion.uom_no_xsd_accepts+D.uom.confusion.uom_no_xsd_rejects).toLocaleString()} comparable pairs (${(D.uom.agreement_excl_cf_enum*100).toFixed(1)}% when ${D.uom.containerfield_enum_rejects} containerField-enumeration rejections are set aside). The ontology alone is right on ${(D.uom.ontology_only_precision*100).toFixed(1)}% of its predictions.<table style="margin-top:6px"><tr><th></th><th>XSD accepts</th><th>XSD rejects</th></tr><tr><td>UOM allows</td><td style="color:var(--gn)">${D.uom.confusion.uom_yes_xsd_accepts.toLocaleString()}</td><td style="color:#ff9d4a">${D.uom.confusion.uom_yes_xsd_rejects}</td></tr><tr><td>UOM denies</td><td style="color:#b583ff">${D.uom.confusion.uom_no_xsd_accepts}</td><td style="color:var(--gn)">${D.uom.confusion.uom_no_xsd_rejects.toLocaleString()}</td></tr></table>Sample note: these are the pairs the ontology predicted, not every possible pair. The 441 remaining UOM-allows/XSD-rejects pairs are not adjudicated. Mechanism (stylesheet read in full): it already emits each range from <span class="mono">acceptableNodeTypes</span>, but every parent emits the same property IRI, so the Turtle pools them (<span class="mono">hasChildren</span> has 49 domains). See <span class="mono">proposal/</span>.</div><div style="margin-top:8px"><button onclick="matrix()">Open the full matrix</button></div><div class="defn" style="margin-top:8px">Rule: the ontology proposes, shapes dispose, the validator gates.</div>`)}
function help(){openM(`<h2>Controls</h2><table><tr><td><span class="kb">/</span></td><td>search</td><td><span class="kb">Esc</span></td><td>clear / close</td></tr><tr><td><span class="kb">H</span> <span class="kb">M</span> <span class="kb">C</span> <span class="kb">X</span> <span class="kb">R</span> <span class="kb">L</span></td><td>toggle hierarchy, multi-parent, containment, cross-check, rings, labels</td><td><span class="kb">1</span>–<span class="kb">8</span></td><td>lens: family, component, depth, fields, parents, kind, 4.1 delta, XSD acceptance</td></tr><tr><td><span class="kb">Q</span></td><td>SPARQL gallery</td><td><span class="kb">T</span></td><td>MCP tools</td></tr><tr><td><span class="kb">G</span></td><td>XSD matrix</td><td><span class="kb">S</span></td><td>simulated sc: overlay</td></tr><tr><td><span class="kb">↑</span></td><td>go to primary parent</td><td><span class="kb">F</span></td><td>fit view</td></tr></table><h3>Reading the map</h3><div class="defn">Rings are depth below the layout root. Squares are abstract types, circles concrete nodes. Dashed pink lines are second and later parents. With a node selected: <span style="color:var(--ac)">cyan</span> arcs go to nodes it may be placed in, <span style="color:var(--mg)">magenta</span> arcs to nodes it may contain. Coloured halos on ten nodes are the doc's cross-check against the XSD (green accepted, red rejected, amber inconclusive).</div><h3>What is not shown</h3><div class="defn">Dr. Polys\'s real sc: files (the SIM overlay is a simulation), Shroud ledger rows, SHACL shapes. Layout and colours are display choices.</div>`)}

function matrix(mode){mode=mode||"xsd";const cl=D.nodes.filter(n=>n.kind==="concrete").sort((a,b)=>a.fam.localeCompare(b.fam)||a.id.localeCompare(b.id)),ix=Object.fromEntries(cl.map((n,i)=>[n.id,i])),K=3,Sz=cl.length*K;
 const legend={xsd:'<span style="color:var(--gn)">■ XSD accepts</span> <span style="color:var(--rd)">■ rejects</span> <span style="color:var(--am)">■ inconclusive</span> <span style="color:#7aa7ff">■ mixed by field</span>',uom:'<span style="color:var(--gn)">■ X3DUOM acceptableNodeTypes allows</span> <span style="color:var(--rd)">■ denies</span> <span style="color:#7aa7ff">■ mixed</span>',agree:'<span style="color:var(--gn)">■ UOM and XSD agree</span> <span style="color:#ff9d4a">■ UOM allows, XSD rejects</span> <span style="color:#b583ff">■ UOM denies, XSD accepts</span> <span style="color:#556">■ not comparable</span>'}[mode];
 openM(`<h2>Containment matrix: rows = child, columns = parent</h2><div style="margin:4px 0"><button data-mx="xsd" class="${mode==="xsd"?"on":""}">XSD verdict</button> <button data-mx="uom" class="${mode==="uom"?"on":""}">X3DUOM prediction</button> <button data-mx="agree" class="${mode==="agree"?"on":""}">UOM vs XSD</button></div><div class="defn" style="color:var(--mu)">Every concrete pair the 4.1 ontology predicts. ${legend}. Ordered by family. Hover for details; click a row to select the child.</div><div style="position:relative;display:inline-block"><canvas id="mxc" width="${Sz}" height="${Sz}" style="position:static;width:${Sz}px;height:${Sz}px;background:#0a0d13;border:1px solid var(--ln);cursor:crosshair"></canvas></div><div id="mxi" class="mono" style="min-height:34px;margin-top:6px"></div>`);
 mc.querySelectorAll("[data-mx]").forEach(b=>b.onclick=()=>matrix(b.dataset.mx));
 const c=document.getElementById("mxc"),g=c.getContext("2d"),cell=Array.from({length:cl.length},()=>new Array(cl.length).fill(null));
 const code=(v,u)=>mode==="xsd"?v:mode==="uom"?(u==="Y"?"A":u==="N"?"R":"I"):((v==="A"||v==="R")&&(u==="Y"||u==="N")?((u==="Y")===(v==="A")?"A":(u==="Y"?"O":"P")):"X");
 cl.forEach(n=>n.lp.forEach(([d,f],k)=>{if(d in ix){const v=code(n.lpv[k],n.lpu[k]),cur=cell[ix[n.id]][ix[d]];cell[ix[n.id]][ix[d]]=cur&&cur.v!==v?{v:"M",f:cur.f+", "+f}:{v,f:(cur?cur.f+", ":"")+f}}}));
 const col={A:"#5be39a",R:"#ff6b6b",I:"#ffc857",M:"#7aa7ff",O:"#ff9d4a",P:"#b583ff",X:"#2a3550"};cell.forEach((r,y)=>r.forEach((q,x)=>{if(q){g.fillStyle=col[q.v];g.fillRect(x*K,y*K,K-.5,K-.5)}}));
 let last=cl[0].fam;g.strokeStyle="#2a3550";cl.forEach((n,i)=>{if(n.fam!==last){last=n.fam;g.beginPath();g.moveTo(i*K,0);g.lineTo(i*K,Sz);g.moveTo(0,i*K);g.lineTo(Sz,i*K);g.stroke()}});
 const nm={A:mode==="agree"?"agree":mode==="uom"?"UOM allows":"XSD accepts",R:mode==="uom"?"UOM denies":"XSD rejects",I:"inconclusive",M:"mixed by field",O:"UOM allows, XSD rejects",P:"UOM denies, XSD accepts",X:"not comparable"};
 c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/K),y=Math.floor((e.clientY-r.top)/K);const q=cell[y]&&cell[y][x];document.getElementById("mxi").innerHTML=cl[y]&&cl[x]?`<b>${esc(cl[y].id)}</b> in <b>${esc(cl[x].id)}</b>${q?` via ${esc(q.f)} · ${nm[q.v]}${cl[y].errs[cl[x].id+"|"+q.f.split(", ")[0]]?`<br><span style="color:var(--mu)">${esc(cl[y].errs[cl[x].id+"|"+q.f.split(", ")[0]])}</span>`:""}`:" · not predicted by the ontology"}`:""};
 c.onclick=e=>{const r=c.getBoundingClientRect(),y=Math.floor((e.clientY-r.top)/K);if(cl[y]){closeM();select(cl[y].id,true)}}}
function simModal(){const S_=D.sim.stats,R=D.sim.reported_real,fx=D.sim.fixture;openM(`<div style="background:#3a0f33;border:1px solid #ff6bd6;border-radius:8px;padding:8px 12px;color:#ffd0f3"><b>SIMULATED.</b> The real sc: ontology (Dr. Polys's 3D_perspective_skill) could not be read: its repository returns 404 unauthenticated and the fork holds only a 363-byte test fixture. What follows is a guess at what such a vocabulary could contain, written from this project's own measurements. Grade S. Not for citation as Polys's work.</div><h2 style="margin-top:12px">What was simulated, and how it compares in scale</h2><table><tr><th></th><th>reported for the real one (L, PR #5 body)</th><th>this simulation</th></tr><tr><td>files</td><td>${R.files}</td><td>${S_.files}</td></tr><tr><td>triples</td><td>${R.triples}</td><td>${S_.triples}</td></tr><tr><td>X3D terms referenced and resolved</td><td>${R.x3d_terms_resolved}</td><td>${S_.node_resolved} class and ${S_.field_resolved} field groundings, all resolve against 4.1</td></tr><tr><td>groundings joined to X3DNode subclasses</td><td>${R.groundings_joined}</td><td>${S_.node_groundings} node groundings across ${S_.concepts} concepts</td></tr><tr><td>namespace</td><td class="mono">${esc(R.namespace)}</td><td class="mono">example.invalid/sim/spatial-cognition#</td></tr></table><div class="defn" style="color:var(--mu);margin-top:4px">Scale is not matched on purpose; content is invented. The first draft had 4 field and 1 class groundings that did not resolve (child-node fields carry a has- prefix; UNIT is a lower-case class); they were fixed against the model.</div><h3>Modules</h3><table><tr><th>module</th><th>concepts</th><th>triples</th><th>echoes</th></tr>${D.sim.modules.map(m=>`<tr><td class="mono">${m.id}</td><td>${m.concepts}</td><td>${m.triples}</td><td style="color:var(--mu)">${{perspective:"frame check, fork PR #5, DOC Q1",parts_contact:"step 4 parts_contact.py",prepositions:"Polys 2024 prompts 2-4, step 4",geons:"Polys 2024 geons and object prompts",scale:"giga and nano goal; float32 arithmetic",heritage:"REPORT.md frame, position_status, grades",agency:"sensors, ROUTE, metadata",verification:"DOC ladder, rungs 0-7 (formalised, not simulated)"}[m.id]||""}</td></tr>`).join("")}</table><h3>Concepts (click to inspect where grounded)</h3>${D.sim.modules.map(m=>`<div style="margin-bottom:4px"><span class="tag">${m.id}</span> ${D.sim.concepts.filter(c=>c.module===m.id).map(c=>`<span class="chip" style="border-color:#8a3a78" data-sim="${c.id}" title="${esc(c.comment)}">${esc(c.label)}</span>`).join("")}</div>`).join("")}<h3>The real fixture in the fork's tests <span class="tag C">C</span></h3><div class="defn">${fx?`${esc(fx.file)}: ${fx.triples} triples in the real namespace. ${fx.rows.map(r=>`<span class="mono">${esc(r.concept)} → ${esc(r.node)} ${r.resolved?'<span style="color:var(--gn)">resolves</span>':'<span style="color:var(--rd)">unresolved in 4.1</span>'}</span>`).join("; ")}. ${esc(fx.note)}.`:"not found"}</div><h3>How to swap in the real files</h3><div class="defn">Drop the 16 .ttl files into <span class="mono">ontology/sim/</span>-shaped input, point <span class="mono">harness/build_sim.py</span> at them (same predicates: x3dNode, x3dField), re-run <span class="mono">harness/make.sh</span>. The explorer's overlay, tab and resolution report work unchanged.</div>`)}
function ladderModal(){const rs=D.sim.concepts.filter(c=>c.kind==="rung").sort((a,b)=>a.rung-b.rung),by={};D.sim.concepts.forEach(c=>{if(c.kind!=="rung"&&c.rung!=null)(by[c.rung]=by[c.rung]||[]).push(c)});const a=D.xcheck.all;
 openM(`<h2>The verification ladder, as an ontology</h2><div class="defn" style="color:var(--mu)">Rungs and checkers are formalised from DOC.md (grade L: my transcription). The simulated concepts hang off the rung that would check them. Counts on rung 2 are real.</div><table><tr><th>rung</th><th>question</th><th>checker</th><th>exact?</th><th>sim concepts</th></tr>${rs.map(r=>`<tr><td><b>${r.rung}</b> ${esc(r.label.split(": ")[1])}</td><td>${esc(r.comment)}</td><td class="mono">${esc(r.check||"")}</td><td>${r.rung<=3?'<span style="color:var(--gn)">exact</span>':r.rung===4?'<span style="color:var(--am)">exact only if closed-world</span>':r.rung===5?"instrument-dependent":"judgment + record"}</td><td>${(by[r.rung]||[]).map(c=>`<span class="chip" style="border-color:#8a3a78" data-sim="${c.id}">${esc(c.label)}</span>`).join("")||"–"}</td></tr>`).join("")}</table><h3>Where this explorer sits</h3><div class="defn">Rung 4 ("lawful") is where the ontology lives. The XSD verdict table (rung 2) measured how far the ontology is from lawful: <span style="color:var(--gn)">${a.A.toLocaleString()}</span> of ${(a.A+a.R).toLocaleString()} conclusive pairs are legal. The matrix is the raw material for a closed-world rung-4 check; no SHACL has been generated, because the property path the Turtle converter uses for each child field has to be fixed first.</div>`)}
function goSim(id){const c=D.sim.concepts.find(z=>z.id===id);if(!c)return;const tgt=(c.nodes[0]&&c.nodes[0].n)||(c.fields[0]&&c.fields[0].n);closeM();S.ov.sim=1;document.querySelector('[data-ov=sim]').classList.add("on");document.getElementById("simban").style.display="block";S.tab="sc";document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t==="sc"));if(tgt&&N[tgt])select(tgt,true);else{S.sel=null;draw();renderInsp()}}
document.addEventListener("click",e=>{const c=e.target.closest("[data-sim]");if(c)goSim(c.dataset.sim)});
document.getElementById("bmx").onclick=matrix;document.getElementById("bs").onclick=simModal;document.getElementById("bl").onclick=ladderModal;

document.getElementById("bq").onclick=gallery;document.getElementById("bm").onclick=tools;document.getElementById("bx").onclick=xcheck;document.getElementById("bh").onclick=help;
mc.addEventListener("click",e=>{const c=e.target.closest("[data-go]");if(c&&N[c.dataset.go]){closeM();select(c.dataset.go,true)}});
addEventListener("keydown",e=>{const t=e.target.tagName==="INPUT";if(e.key==="Escape"){if(modal.style.display==="flex")closeM();else{document.getElementById("q").value="";doSearch();select(null)}return}if(t)return;const k=e.key;
 if(k==="/"){e.preventDefault();document.getElementById("q").focus()}else if("hmcxrls".includes(k.toLowerCase())&&k.length===1){const m={h:"hier",m:"multi",c:"cont",x:"xchk",r:"rings",l:"lab",s:"sim"}[k.toLowerCase()];document.querySelector(`[data-ov=${m}]`).click()}
 else if(k>="1"&&k<="8"){const v=["fam","comp","depth","fields","lp","kind","ver","xsd"][+k-1];document.getElementById("lens").value=v;S.lens=v;renderLegend();draw();renderList()}
 else if(k==="g")matrix();else if(k==="q")gallery();else if(k==="t")tools();else if(k==="?")help();else if(k==="f")fit();else if(k==="ArrowUp"&&S.sel&&N[S.sel].pp)select(N[S.sel].pp,true)});

addEventListener("resize",resize);requestAnimationFrame(()=>{resize()});resize();renderLegend();renderList();renderInsp();renderBot();
