<title>Dynasty Hypersphere</title>
<!--@FONTS@-->
<meta name="loom:xite" content="x_ite/x_ite.min.js">
<meta name="description" content="Three families as a glass time-sphere: radius is time from the founders' seed to the glass, houses are sectors west to east, each life a glowing fiber, each marriage an arc on the shell of its year. Standard X3D 4.0 with GLSL shaders, drawn by X_ITE 16.5.1.">
<!-- Page for the dynasty hypersphere (proto/hyper). A fragment: the Artifact host (and tools/gate_hyper.js, tools/hyper_csp_gate.js) wrap it in a
     document skeleton. The .x3d, .hyper.json, .geometry.json and hyper-manifest.json beside it are generated by build_hypersphere.py: never edit them.
     X_ITE 16.5.1: the copy shipped beside the page (named in <meta name="loom:xite">), falling back to the pinned jsDelivr path; both with SRI.
     Params: ?family=habsburg ?stop=3 ?tier=fast|balanced|ultra ?auto=0 ?extras=0 ?ui=none ?idle=0 ?fell=1850; the family also lives in #rothschild,
     #habsburg, #darwin-wedgwood. Our code never evaluates strings as code and fetches only same-origin files. -->
<style>
/*@THEME_CSS@*/
</style>
<x3d-canvas id="x3d" splashScreen="false" notifications="false" contextMenu="false" timings="false" multisampling="4"></x3d-canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>
<svg id="grain" aria-hidden="true"><filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainf)"/></svg>
<div id="lead" aria-hidden="true"></div>
<figure id="portrait"><div class="frame"><div class="ph"><img id="pimg" alt="" decoding="async" hidden><span class="mono" id="pmono" hidden></span></div></div><figcaption><b id="pname"></b><span id="pyears"></span><span class="plab" id="plab"></span></figcaption></figure>
<header class="panel">
  <span class="brand" id="brand">Dynasty Loom<small id="brandsub"></small></span>
  <span class="sub" id="sub">radius = time · fiber = a life · arc = a marriage · dye = share of descent from the founders</span>
  <nav id="fams" aria-label="Family"></nav>
  <button id="look-t" aria-pressed="false">Night</button>
</header>
<nav id="rail" aria-label="Tour stops"></nav>
<section id="cap" class="panel" aria-live="polite">
  <div class="head"><span id="capn"></span><b id="capt">Loading</b><span id="capy"></span><span id="shotchip"></span><button id="more-t" aria-expanded="false" aria-controls="more">Details</button></div>
  <p id="narr"></p>
  <div class="ctl">
    <button id="prev" aria-label="Previous stop">‹</button><button id="tour" aria-label="Play the tour">Tour ▸</button><button id="next" aria-label="Next stop">›</button>
    <label for="fell">Year <input type="range" id="fell" min="1700" max="2026" step="1" value="2026"><output id="fellv">2026</output></label>
  </div>
  <div id="more">
    <p id="comp"></p>
    <p id="scale"></p>
    <div class="ctl">
      <label for="shots">Shot <select id="shots" aria-label="Fly to a shot"></select></label>
      <span id="tiers" role="group" aria-label="Quality"><button data-tier="0">Fast</button><button data-tier="1">Balanced</button><button data-tier="2">Ultra</button>
        <label class="tick" title="lower the quality when the frame rate falls"><input type="checkbox" id="auto" checked> auto</label></span>
      <span id="fps"></span><span id="where"></span>
      <span class="keys">T tour · ←/→ stops · P plunge · W wide · [ ] { } year · Q quality · Esc clear</span>
    </div>
  </div>
</section>
<aside id="card" class="panel" hidden aria-live="polite"></aside>
<div id="tag" class="panel" hidden></div>
<div id="toast" class="panel" role="status"></div>
<div id="status">starting X_ITE</div>
<noscript>This page needs JavaScript: the scene is X3D drawn by X_ITE.</noscript>

      if (pt.leader) { tx = right ? R.x1 - cw : R.x0; ty = pp.y < (R.y0 + R.y1) / 2 ? R.y1 - ch : R.y0; }

    e.style.transform = 'translate(' + por.x.toFixed(1) + 'px,' + por.y.toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';

      ld.style.width = Math.max(0, L - 2).toFixed(1) + 'px'; ld.style.transform = 'translate(' + por.px.toFixed(1) + 'px,' + por.py.toFixed(1) + 'px) rotate(' + Math.atan2(qy - por.py, qx - por.px).toFixed(4) + 'rad)';

  A.portraitState = function () { return A.portrait || null; };

  var plates = { cur: null, t0: 0, D: 0 };

  }

  }

      var c = project(it.pos), r = project(add(it.pos, mul(rt, it.w / 2))), u = project(add(it.pos, mul(upv, it.h / 2))); if (!c || !r || !u) return;

  };

  // ---------------------------------------------------------------- keys

    if (k === 'ArrowLeft') { step(-1); return; }

    if (k === 'w' || k === 'W') { flyShot('Wide'); return; }
    if (k === 'c' || k === 'C') { flyShot('Crown'); return; }
    if (k === 'f' || k === 'F') { flyShot('Flywheel'); return; }

    if (k === '[' || k === ']') { A.setFell(A.fell + (k === ']' ? 1 : -1)); return; }
    if (k === '{' || k === '}') { A.setFell(A.fell + (k === '}' ? 25 : -25)); return; }

  });
  document.querySelectorAll('#tiers button').forEach(function (b) { b.onclick = function () { A.setTier(+b.dataset.tier); }; });
  $('auto').onchange = function () { A.auto = this.checked; };
  if (!window.dynastyApi) {   /* the standalone page (the two-view shell does this for the merged page) */
    $('more-t').onclick = function () { var c = $('cap'), o = !c.classList.contains('open'); c.classList.toggle('open', o); this.setAttribute('aria-expanded', String(o)); this.textContent = o ? 'Less' : 'Details'; };
    $('look-t').hidden = true; $('brandsub').textContent = '';
  }

    if (fellAnim) { var u = clamp((now - fellAnim.t0) / fellAnim.ms, 0, 1); setFell(fellAnim.a + (fellAnim.b - fellAnim.a) * smoother(u)); if (u >= 1) fellAnim = null; }
