     X_ITE 16.5.1: the copy shipped beside the page (named in <meta name="loom:xite">), falling back to the pinned jsDelivr path; both with SRI.
     Params: ?family=habsburg ?stop=3 ?tier=fast|balanced|ultra ?auto=0 ?extras=0 ?ui=none ?idle=0 ?fell=1850; the family also lives in #rothschild,

    if (p.sources.length || p.wikipedia) { h.push('<ul>'); (p.wikipedia && p.sources.indexOf(p.wikipedia) < 0 ? [p.wikipedia] : []).concat(p.sources).forEach(function (s) { h.push('<li><a href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s.replace(/^https?:\/\//, '')) + '</a></li>'); }); h.push('</ul>'); }
    h.push('<h3>COMPUTED</h3>');
    var dyes = Object.keys(p.shares || {}).map(function (k) { return '<span class="sw" style="background:' + esc((C.dyes[k] || {}).color || '#888') + '"></span>' + esc(k) + ' ' + esc(p.shares[k]); }).join(' · ');
    h.push('<p>Dye (share of descent from the founders): ' + (dyes || 'none') + chip('∑') + '</p>');
    if (p.generation) h.push('<p>Steps from the founders: ' + (p.generation[0] === p.generation[1] ? p.generation[0] : p.generation[0] + ' to ' + p.generation[1] + ', by different paths') + chip('∑') + '</p>');
    p.unions.forEach(function (uid) { var un = C.unions[uid]; if (un && un.close) h.push('<p>Kinship with ' + esc(nameOf(un.a === id ? un.b : un.a)) + ': φ = ' + (+un.phi).toFixed(4) + ' (drawn doubled)' + chip('∑') + '</p>'); });
    if (p.move) h.push('<p>Fiber bends' + (p.move.estimated ? ' (year not in the data, drawn dotted)' : ' on the ' + p.move.year + ' shell') + ': ' + esc(p.move.why) + chip(p.move.estimated ? '≈' : p.move.grade || '∑') + '</p>');
    if (p.why) h.push('<p>Dashed: ' + esc(p.why) + '</p>');
    var r0 = (u.R0 + (p.born - u.Y0) * u.K).toFixed(3), r1 = p.died == null ? null : (u.R0 + (p.died - u.Y0) * u.K).toFixed(3);
    h.push('<p>On the sphere: radius ' + r0 + (r1 ? ' to ' + r1 : ' outward (death not in the data)') + ' pocket units, in the ' + esc(p.house_name) + ' sector' + chip('∑') + '</p>');
    card.innerHTML = h.join(''); card.hidden = false;
    card.querySelector('.x').onclick = function () { clearPick(); };
    card.querySelectorAll('a[data-p]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); pick(a.dataset.p, true); }; });
  }

  // ---------------------------------------------------------------- keys
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || !D || !A.ready) return;
    var k = e.key, tag = e.target.tagName, inInput = (tag === 'INPUT' && !/^(range|checkbox)$/.test(e.target.type)) || tag === 'SELECT' || tag === 'TEXTAREA';
    if (tag === 'INPUT' && /^Arrow/.test(k)) return;   // a focused slider keeps its own arrow keys; letters still drive the scene
    lastInput = performance.now();
    if (k === 't' || k === 'T') { if (tourOn) A.tourStop(); else A.tour(Math.max(0, A.stop)); return; }
    if (k === 'h' || k === 'H') { if (tourHeld) A.tourRelease(); else A.tourHold(); return; }
    if (inInput) return;
    if (k === 'ArrowRight') { step(1); return; }
    if (k === 'ArrowLeft') { step(-1); return; }
    if (k === 'p' || k === 'P') { plunge(); return; }
    if (k === 'w' || k === 'W') { flyShot('Wide'); return; }
    if (k === 'c' || k === 'C') { flyShot('Crown'); return; }
    if (k === 'f' || k === 'F') { flyShot('Flywheel'); return; }
    if (k === 'q' || k === 'Q') { A.setTier((A.tierIndex + 2) % 3); toast('quality: ' + A.tier); return; }
    if (k === '[' || k === ']') { A.setFell(A.fell + (k === ']' ? 1 : -1)); return; }
    if (k === '{' || k === '}') { A.setFell(A.fell + (k === '}' ? 25 : -25)); return; }
    if (k === 'Escape') { clearPick(); A.tourStop(); }
  });
  document.querySelectorAll('#tiers button').forEach(function (b) { b.onclick = function () { A.setTier(+b.dataset.tier); }; });
  $('auto').onchange = function () { A.auto = this.checked; };

  // ---------------------------------------------------------------- the frame loop: flights, the fell, labels, the HUD, idle
  function frame(now) {
    frameNow = now; applyFlight(now); stepFocus(now); stepGuard(now);
    if (fellAnim) { var u = clamp((now - fellAnim.t0) / fellAnim.ms, 0, 1); setFell(fellAnim.a + (fellAnim.b - fellAnim.a) * smoother(u)); if (u >= 1) fellAnim = null; }
    layoutLabels(false);
    if (D && cam.p && now - (frame.hud || 0) > 250) {
      frame.hud = now;
      var r = len(cam.p), u2 = D.units, w = $('where');
      if (r < u2.R) w.textContent = 'camera inside the glass · r ' + r.toFixed(3) + ' = ' + Math.round(Math.max(u2.Y0 + (r - u2.R0) / u2.K, u2.Y0)) + (r < u2.R0 ? ' (core)' : '');
      else w.textContent = 'camera outside · ' + (r / u2.R).toFixed(1) + ' glass radii from the seed';
    }
    if (IDLE && A.ready && !tourOn && !flight && cam.shot !== 'Flywheel' && now - lastInput > 40000) A.bindNative('Flywheel', 2.4);
    requestAnimationFrame(frame);
  }
})();
