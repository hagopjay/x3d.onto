<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Dynasty Loom</title>
<meta name="description" content="Three families as cloth on a loom: time runs up, houses stand west to east, each life is a warp thread, each marriage a weft pick; a thread's dye is its share of descent from the founders. X3D 4.0 drawn by X_ITE 16.5.1.">
<!-- Page for the tapestry-loom scenes (proto/scene2). The .x3d, .cards.json and loom-manifest.json beside it are generated by build_loom_scene.py: never edit them by hand.
     X_ITE 16.5.1 comes from jsDelivr (pinned, with subresource integrity); ?local=1 loads the vendored, byte-identical copy instead (tests). An Artifact build
     (tools/make_artifact.py) ships X_ITE beside the page and names it in <meta name="loom:xite">, falling back to jsDelivr if that copy does not load.
     Other params: ?family=habsburg  ?stop=3 (index into the family's stops)  ?ui=none (no chrome)  ?fell=1850; the family also reads from and writes to #rothschild, #habsburg, #darwin-wedgwood -->
<style>
  :root {
    --scene: #0f0d0c; --panel: rgba(232, 224, 209, .9); --ink: #2b2420; --dim: #5e5447; --gold: #765a17; --red: #9e1b1b; --line: rgba(118, 90, 23, .38);
    --chip: rgba(43, 36, 32, .08); --shadow: 0 6px 22px rgba(0, 0, 0, .35); --status: #a99d88; --alert: #ff9a7a;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel: rgba(20, 17, 15, .88); --ink: #efe6d6; --dim: #a99d88; --gold: #d6b25c; --red: #d0564a; --line: rgba(214, 178, 92, .35); --chip: rgba(239, 230, 214, .08); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --panel: rgba(20, 17, 15, .88); --ink: #efe6d6; --dim: #a99d88; --gold: #d6b25c; --red: #d0564a; --line: rgba(214, 178, 92, .35); --chip: rgba(239, 230, 214, .08); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--scene); color: var(--ink); font: 14px/1.45 var(--serif); }
  x3d-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
  header { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 7px 12px; }
  header .brand { font: 600 12px/1.2 var(--mono); letter-spacing: .22em; color: var(--gold); }
  header .sub { font: 12px/1.3 var(--mono); color: var(--dim); }
  #fams { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  button, .btn { font: 12px/1 var(--mono); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; cursor: pointer; }
  button:hover, button.on { border-color: var(--gold); color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #rail { position: fixed; right: 16px; top: calc(74px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; max-height: calc(100vh - 300px); overflow-y: auto; }
  #rail button { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: var(--panel); }
  #rail button .t { display: none; }
  #rail button.on .t, #rail button:hover .t { display: inline; }
  #cap { position: fixed; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px 10px; max-height: 196px; overflow-y: auto; }
  #cap .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font: 12px/1.3 var(--mono); color: var(--dim); }
  #cap .head b { color: var(--gold); font-weight: 600; letter-spacing: .04em; }
  #cap p { margin: 4px 0 0; }
  #narr { font-size: 16px; }
  #comp { font: 12px/1.45 var(--mono); color: var(--dim); }
  #gauge { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; margin-left: auto; }
  .gz i { display: inline-block; width: 12px; height: 10px; margin-left: 1px; border-radius: 2px; vertical-align: -1px; border: 1px solid var(--line); }
  .g { display: inline-block; font: 600 10px/1 var(--mono); padding: 2px 5px; margin-left: 4px; border-radius: 6px; border: 1px solid var(--line); color: var(--gold); vertical-align: 1px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; }
  .ctl label { font: 12px/1 var(--mono); color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .ctl input[type=range] { width: 160px; accent-color: #c9a24e; }
  .keys { font: 11px/1.3 var(--mono); color: var(--dim); margin-left: auto; }
  #card { position: fixed; z-index: 4; top: calc(74px + env(safe-area-inset-top, 0px)); right: 92px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 300px); overflow-y: auto; padding: 12px 14px; }
  #card h2 { margin: 0; font: 600 17px/1.25 var(--serif); }
  #card .yrs { font: 12px/1.4 var(--mono); color: var(--dim); margin-top: 2px; }
  #card h3 { margin: 10px 0 2px; font: 600 10px/1.2 var(--mono); letter-spacing: .14em; color: var(--gold); }
  #card p, #card li { margin: 2px 0; font-size: 13px; }
  #card ul { margin: 2px 0; padding-left: 18px; }
  #card a { color: var(--gold); word-break: break-all; }
  #card .x { position: absolute; top: 8px; right: 8px; padding: 3px 8px; }
  #card .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
  #tag { position: fixed; pointer-events: none; padding: 4px 8px; font: 12px/1.2 var(--mono); transform: translate(12px, -130%); white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 12px; font: 12px/1.3 var(--mono); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 13px/1.4 var(--mono); color: var(--status); text-align: center; padding: 0 16px; }
  [hidden] { display: none !important; }
  body[data-ui="none"] header, body[data-ui="none"] #rail, body[data-ui="none"] #cap, body[data-ui="none"] #card, body[data-ui="none"] #tag { display: none !important; }
  @media (max-width: 720px) {
    header { top: calc(8px + env(safe-area-inset-top, 0px)); padding: 6px 10px; }
    header .sub { display: none; }
    #rail { top: auto; bottom: calc(188px + env(safe-area-inset-bottom, 0px)); right: 16px; left: 16px; flex-direction: row; overflow-x: auto; max-height: none; align-items: center; }
    #rail button { flex: 0 0 auto; }
    #cap { max-height: 168px; padding: 8px 12px; }
    #narr { font-size: 14px; }
    .keys { display: none; }
    .ctl input[type=range] { width: 110px; }
    #card { top: auto; right: 16px; left: 16px; width: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 58vh; z-index: 3; }
  }
</style>
</head>
<body>
<x3d-canvas id="x3d" splashScreen="false" notifications="false" contextMenu="false" timings="false" multisampling="4"></x3d-canvas>
<header class="panel">
  <span class="brand">DYNASTY LOOM</span>
  <span class="sub" id="sub">warp = lives · weft = marriages · dye = share of descent from the founders</span>
  <nav id="fams" aria-label="Family"></nav>
</header>
<nav id="rail" aria-label="Tour stops"></nav>
<section id="cap" class="panel" aria-live="polite">
  <div class="head"><span id="capn"></span><b id="capt">Loading</b><span id="capy"></span><span id="gauge" aria-label="Dye gauge: thread colour by share of descent"></span></div>
  <p id="narr"></p>
  <p id="comp"></p>
  <div class="ctl">
    <button id="prev" aria-label="Previous stop">‹</button><button id="tour" aria-label="Play the tour">Tour ▸</button><button id="next" aria-label="Next stop">›</button>
    <label for="fell">Fell <input type="range" id="fell" min="1700" max="2026" step="1" value="2026"><output id="fellv">2026</output></label>
    <span class="keys">1–8 ladder · T tour · ←/→ stops · [ ] { } fell · Esc clear</span>
  </div>
</section>
<aside id="card" class="panel" hidden aria-live="polite"></aside>
<div id="tag" class="panel" hidden></div>
<div id="toast" class="panel" role="status"></div>
<div id="status">starting X_ITE</div>
<noscript>This page needs JavaScript: the scene is X3D drawn by X_ITE.</noscript>
<script>
(function () {
  'use strict';
  var XITE_CDN = 'https://cdn.jsdelivr.net/npm/x_ite@16.5.1/dist/x_ite.min.js';
  var XITE_LOCAL = '../../x3d/vendor/x_ite/x_ite.min.js';          /* the vendored copy (tests): byte-identical to the npm tarball's dist/x_ite.min.js */
  var XITE_META = document.querySelector('meta[name="loom:xite"]');   /* an Artifact build: X_ITE beside the page, since that CSP refuses X_ITE's runtime fetches from a CDN */
  var XITE_SRI = 'sha384-/U1JwiaA22Ilp0Ju84O+ud9jJvfpVM3sasBhBHoAY4wQXGMc2d82QmdIZYhC1a4g';
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  document.body.dataset.ui = q.get('ui') === 'none' ? 'none' : 'full';
  var A = window.loomApi = { ready: false, log: [], family: null, cards: null, stop: -1, picked: null, fell: null };
  var statusEl = $('status');
  function log(s) { A.log.push(((performance.now()) / 1000).toFixed(1) + ' s ' + s); }
  function status(s, err) { statusEl.textContent = s || ''; statusEl.hidden = !s; if (err) statusEl.style.color = 'var(--alert)'; log(s); }
  function toast(s) { var t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, 2600); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var GRADES = { 'C': 'checked in a source', 'L': 'one secondary source', 'S': 'from memory, unchecked', '⚑': 'contested', '∑': 'computed from the file', '≈': 'interpretation',
    'Confirmed': 'Confirmed by the harvest', 'Likely': 'Likely (one secondary source)', 'Suspected': 'Suspected (unchecked)' };
  function chip(g) { return '<span class="g" title="' + esc(g.split(' ').map(function (x) { return GRADES[x] || x; }).join('; ')) + '">' + esc(g) + '</span>'; }

  // ---- X_ITE: one script from the pinned CDN path (or the vendored copy, or an Artifact's own copy then the CDN), with subresource integrity

  var s = document.createElement('script');

    status('could not load X_ITE from ' + s.src, true); document.body.dataset.loaded = 'failed'; A.failed = 'x_ite script';
  };
  s.onload = function () { A.xite = s.src;   /* X3D()'s promise is made once, at X_ITE's own load, and waits for DOMContentLoaded, which an injected script misses;

  })(0);

  function node(n) { try { return browser.currentScene.getNamedNode(n); } catch (e) { return null; } }

    var root = el.shadowRoot, b = root && root.querySelector('.x_ite-private-browser');
    if (!b || b.style.display !== 'none') return;
    var st = document.createElement('style');
    st.textContent = ':host{display:block;overflow:hidden}.x_ite-private-browser{height:100%;outline:none;overflow:hidden;position:relative}.x_ite-private-surface{height:100%}.x_ite-private-canvas{height:100%;width:100%}.x_ite-private-splash-screen{display:none}';
    root.appendChild(st); b.style.display = ''; log('x_ite.css not loaded: inline fallback used');
  }
  function boot() {
    browser = A.browser = el.browser;
    setTimeout(cssFallback, 4000);
    fetch('loom-manifest.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for loom-manifest.json'); return r.json(); }).then(function (m) {
      manifest = A.manifest = m; var nav = $('fams');
      m.families.forEach(function (f) { var b = document.createElement('button'); b.textContent = f.name; b.dataset.key = f.key; b.setAttribute('role', 'tab'); b.onclick = function () { loadFamily(f.key, 0); }; nav.appendChild(b); });
      var want = q.get('family') || hashFamily(); loadFamily(m.families.some(function (f) { return f.key === want; }) ? want : m.families[0].key, +(q.get('stop') || 0));
    }).catch(fail);
  }
  function hashFamily() { try { return decodeURIComponent(location.hash.slice(1)).replace(/-/g, '_'); } catch (e) { return ''; } }   /* an Artifact's link carries only a plain #name */
  addEventListener('hashchange', function () {
    var k = hashFamily(); if (manifest && k !== A.family && k !== A.loading && manifest.families.some(function (f) { return f.key === k; })) loadFamily(k, 0);
  });
  function fail(e) { A.failed = String(e && e.message || e); document.body.dataset.loaded = 'failed'; status('could not load: ' + A.failed, true); }

  function loadFamily(key, stopIndex) {
    stopTour(); clearPick(); document.body.dataset.loaded = '0'; A.ready = false; A.loading = key; status('loading ' + key);
    var h = '#' + key.replace(/_/g, '-'); if (location.hash !== h) location.hash = h;
    var f = manifest.families.find(function (x) { return x.key === key; });
    document.querySelectorAll('#fams button').forEach(function (b) { b.classList.toggle('on', b.dataset.key === key); b.setAttribute('aria-selected', b.dataset.key === key); });
    Promise.all([browser.loadURL(new X3D.MFString(f.scene)), fetch(f.cards).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + f.cards); return r.json(); })]).then(function (res) {
      C = A.cards = res[1]; A.family = key; A.loading = null; N = {};
      ['Labels', 'LabelsPhone', 'Leaders', 'LeadersPhone', 'Marks', 'FellClip', 'GhostClip', 'LabelClip', 'Fell', 'SelCoord', 'SelLine', 'SelHalo', 'ClothTouch', 'BeadMat', 'WeftMat', 'WeftCloseMat', 'WeftEstMat',
       'WarpMat_core', 'WarpMat_inlaw', 'WarpMat_dashed', 'WarpMat_faint', 'WarpMat_moves_est', 'MoverMat'].forEach(function (n) { N[n] = node(n); });
      buildRail(); wireTouch(); gauge();
      var fell = $('fell'); fell.min = C.layout.Y0; fell.max = C.layout.top; A.stop = -1; setFell(C.layout.top);
      $('sub').textContent = C.name + ' · ' + Object.keys(C.people).length + ' threads · warp = lives · weft = marriages · ' + Object.keys(C.dyes).map(function (k) { return (C.dyes[k].hue || 'dye') + ' = ' + k + ' descent'; }).join(', ');
      bindStop(Math.max(0, Math.min(C.stops.length - 1, stopIndex || 0)));
      if (q.get('fell')) setFell(+q.get('fell'));                 /* an explicit ?fell= wins over the stop's own year */
      requestAnimationFrame(function () { requestAnimationFrame(function () { status(''); A.ready = true; document.body.dataset.loaded = '1'; }); });
    }).catch(fail);
  }

  // ---- stops, captions, tour
  function buildRail() {
    var rail = $('rail'); rail.innerHTML = '';
    C.stops.forEach(function (st, i) {
      var b = document.createElement('button'); b.dataset.i = i; b.title = st.title;
      b.innerHTML = '<span>' + (st.key === 'wide' ? 'W' : st.n) + '</span><span class="t">' + esc(st.title) + '</span>'; b.onclick = function () { stopTour(); bindStop(i); }; rail.appendChild(b);
    });
  }
  function fitFov(vp, st) {   /* X_ITE's field of view spans the smaller side: on a portrait screen that is the width, so widen it just enough for the stop's frame */
    var c = st.camera, need = 2 * Math.atan(1.06 * (c.frame_w / 2) / c.dist);

  }
  function gauge() {   /* the dye ramp the threads are drawn with (cards: ramp), share 1 down to 0, so a 3/4 child can be told from a 1/2 cousin */
    $('gauge').innerHTML = Object.keys(C.ramp || {}).map(function (k) {
      return '<span class="gz">' + esc(k) + ' ' + C.ramp[k].steps.map(function (s) { return '<i style="background:' + esc(s[1]) + '" title="' + esc(k + ' share ' + s[0]) + '"></i>'; }).join('') + ' 1→0</span>';
    }).join('');
  }
  function phoneView() { return innerWidth < innerHeight; }
  function bindStop(i) {   /* a portrait screen binds the stop's phone viewpoint and labels; every stop sets the fell to its own year and shows its subject's thread */
    var st = C.stops[i], ph = phoneView() && st.phone ? st.phone : null, vp = node(ph ? ph.def_ : st.def_); if (!vp) return false;
    if (!ph) fitFov(vp, st); vp.set_bind = true; A.stop = i; A.view = ph ? 'phone' : 'desktop';
    if (N.Labels) N.Labels.whichChoice = ph ? -1 : i; if (N.LabelsPhone) N.LabelsPhone.whichChoice = ph ? i : -1;
    if (N.Marks) N.Marks.whichChoice = st.marks == null ? -1 : st.marks;                     /* indices into the Switches that hold only non-empty groups */
    if (N.Leaders) N.Leaders.whichChoice = ph || st.leaders == null ? -1 : st.leaders; if (N.LeadersPhone) N.LeadersPhone.whichChoice = ph && st.phone.leaders != null ? st.phone.leaders : -1;

    document.querySelectorAll('#rail button').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === i); });
    $('capn').textContent = (st.key === 'wide' ? '' : 'stop ' + st.n + ' · ') + (i + 1) + ' / ' + C.stops.length;
    $('capt').textContent = st.title; $('capy').textContent = st.years[0] + '–' + st.years[1];
    $('narr').innerHTML = st.narration.map(function (s) { return esc(s.text) + chip(s.grade); }).join(' ') || '<span style="color:var(--dim)">No narration drafted for this stop; the line below is computed from the file.</span>';
    $('comp').innerHTML = st.computed.map(function (s) { return esc(s.text) + chip(s.grade); }).join(' ');
    return true;
  }
  function step(d) { bindStop((A.stop + d + C.stops.length) % C.stops.length); }
  function stopTour() { if (tourTimer) clearTimeout(tourTimer); tourTimer = null; $('tour').textContent = 'Tour ▸'; }
  function tourNext() {

  function setFell(year) {

    if (N.LabelClip) N.LabelClip.plane = new X3D.SFVec4f(0, -1, 0, y + 0.05 + (((C.stops[A.stop] || {}).clip_pad) || 0));   /* the bound stop's labels may reach this far above its fell */
    if (N.GhostClip) N.GhostClip.plane = new X3D.SFVec4f(0, 1, 0, -(y + 0.05));
    if (N.Fell) N.Fell.translation = new X3D.SFVec3f(0, y, 0);

  function fellEvents() {
    var y = A.fell, ev = (C.events || []).filter(function (e) { return Math.abs(e.year - y) <= 2; });
    var born = Object.keys(C.people).filter(function (k) { return C.people[k].born === y; }).length, wed = Object.keys(C.unions).filter(function (k) { return C.unions[k].year === y; }).length;
    toast('fell ' + y + ': ' + born + ' births, ' + wed + ' picks' + (ev.length ? ' · ' + ev.map(function (e) { return e.year + ' ' + e.label + ' (' + e.grade + ')'; }).join(' · ') : ''));
  }

  // ---- picking: one TouchSensor; its hitPoint lies in the plane of the house it hit
  var lastHit = null, over = false, mouse = [0, 0];
  el.addEventListener('pointermove', function (e) { mouse = [e.clientX, e.clientY]; if (!over) $('tag').hidden = true; });
  function nearest(h) {
    if (!h || !C) return null;
    var hs = C.houses, gap = C.layout.HOUSE_GAP / 2, house = null;
    for (var i = 0; i < hs.length; i++) if (h[0] >= hs[i].x0 - gap && h[0] <= hs[i].x1 + gap) { house = hs[i]; break; }
    if (!house) return null;

    Object.keys(C.people).forEach(function (id) {
      C.people[id].pieces.forEach(function (pc) {
        if (pc[0] !== house.key || yr < pc[3] - 1.5 || yr > pc[4] + 1.5) return;
        var d = Math.abs(h[0] - pc[1]); if (d <= C.layout.LX * 0.75 && (!best || d < best.d)) best = { id: id, d: d };

  }
  function wireTouch() {
    var t = N.ClothTouch; if (!t) return;
    t.addFieldCallback('loom', 'hitPoint_changed', function (v) {
      lastHit = [v.x, v.y, v.z]; var id = nearest(lastHit), tag = $('tag');
      if (id && over) { var p = C.people[id]; tag.textContent = p.label + ' · ' + p.born + '–' + (p.died == null ? '?' : p.died) + ' · ' + p.house_name; tag.style.left = mouse[0] + 'px'; tag.style.top = mouse[1] + 'px'; tag.hidden = false; }
      else tag.hidden = true;
    });
    t.addFieldCallback('loom', 'isOver', function (v) { over = !!v; if (!v) $('tag').hidden = true; });
    t.addFieldCallback('loom', 'touchTime', function () { var id = nearest(lastHit); if (id) pick(id); else clearPick(); });
  }
  function dim(on) {
    ['WarpMat_core', 'WarpMat_inlaw', 'WarpMat_dashed', 'WeftMat', 'WeftCloseMat'].forEach(function (n) { if (N[n]) N[n].transparency = on ? 0.72 : 0; });
    if (N.BeadMat) N.BeadMat.transparency = on ? 0.6 : 0;
  }
  function pick(id) {
    var p = C.people[id]; if (!p) return false; A.picked = id;
    var Y = function (yr) { return (yr - C.layout.Y0) * C.layout.TY; }, pts = [], counts = [];
    p.pieces.forEach(function (pc) { pts.push(new X3D.SFVec3f(pc[1], Y(pc[3]), pc[2] + 0.03)); pts.push(new X3D.SFVec3f(pc[1], Y(pc[4]), pc[2] + 0.03)); });
    counts.push(pts.length);                                   /* the thread as one polyline (through its move), then each of its picks */
    p.unions.forEach(function (uid) { var u = C.unions[uid]; if (!u) return;
      pts.push(new X3D.SFVec3f(u.pts[0][0], Y(u.year), u.pts[0][1] + 0.03)); pts.push(new X3D.SFVec3f(u.pts[1][0], Y(u.year), u.pts[1][1] + 0.03)); counts.push(2); });
    if (N.SelCoord && N.SelLine) { N.SelCoord.point = new X3D.MFVec3f(...pts); N.SelLine.vertexCount = new X3D.MFInt32(...counts); }
    if (N.SelHalo) { N.SelHalo.translation = new X3D.SFVec3f(p.pieces[0][1], Y(p.born), p.pieces[0][2] + 0.03); N.SelHalo.scale = new X3D.SFVec3f(1, 1, 1); }
    dim(true); showCard(id); return true;
  }
  function clearPick() {
    A.picked = null; $('card').hidden = true;
    if (N.SelCoord && N.SelLine) { N.SelCoord.point = new X3D.MFVec3f(new X3D.SFVec3f(0, -1000, 0), new X3D.SFVec3f(0, -1000, 0)); N.SelLine.vertexCount = new X3D.MFInt32(2); }
    if (N.SelHalo) N.SelHalo.scale = new X3D.SFVec3f(0, 0, 0);
    dim(false);
  }
  function nameOf(id) { var p = C.people[id]; return p ? p.name : id; }
  function link(id) { return C.people[id] ? '<a href="#" data-p="' + esc(id) + '">' + esc(C.people[id].name) + '</a>' : esc(id); }
  function years(p) {
    var b = (p.born_precision === 'circa' ? 'c. ' : '') + p.born, d = p.died == null ? 'death not in the data' : (p.died_precision === 'circa' ? 'c. ' : '') + p.died;
    return b + '–' + d;
  }
  function showCard(id) {
    var p = C.people[id], card = $('card'), h = [];
    h.push('<button class="x" aria-label="Close the card">×</button>');
    h.push('<h2>' + esc(p.name) + chip(p.grade || 'Suspected') + '</h2>');
    h.push('<div class="yrs">' + esc(years(p)) + ' · ' + esc(p.house_name) + (p.move ? ' (from ' + esc((C.houses.find(function (x) { return x.key === p.childhood_house; }) || {}).name || p.childhood_house) + ', ' + (p.move.estimated ? 'year not in the data' : p.move.year) + ')' : '') + ' · ' + (p.core ? 'born in the family' : 'in-law') + '</div>');
    h.push('<h3>RECORD</h3>');
    if (p.note) h.push('<p>' + esc(p.note) + '</p>');
    var par = [p.father, p.mother].filter(Boolean);
    h.push('<p>Parents: ' + (par.length ? par.map(link).join(' and ') : 'not in the data') + '</p>');
    p.unions.forEach(function (uid) { var u = C.unions[uid]; if (!u) return; var o = u.a === id ? u.b : u.a;
      h.push('<p>Married ' + link(o) + ', ' + (u.year_precision === 'unknown' ? 'year not in the data (drawn ' + u.year + ')' : (u.year_precision === 'circa' ? 'c. ' : '') + u.year) + chip(u.confidence || 'Suspected') + (u.close ? ' · close: ' + esc(u.relationship || 'kin') : '') + '</p>'); });
    if (p.children.length) h.push('<p>Children in the data: ' + p.children.map(link).join(', ') + '</p>');
    if (p.sources.length || p.wikipedia) { h.push('<ul>'); (p.wikipedia && p.sources.indexOf(p.wikipedia) < 0 ? [p.wikipedia] : []).concat(p.sources).forEach(function (u) { h.push('<li><a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u.replace(/^https?:\/\//, '')) + '</a></li>'); }); h.push('</ul>'); }
    h.push('<h3>COMPUTED</h3>');
    var dyes = Object.keys(p.shares || {}).map(function (k) { return '<span class="sw" style="background:' + esc((C.dyes[k] || {}).color || '#888') + '"></span>' + esc(k) + ' ' + esc(p.shares[k]); }).join(' · ');
    h.push('<p>Dye (share of descent from the founders): ' + (dyes || 'none') + chip('∑') + '</p>');
    if (p.generation) h.push('<p>Steps from the founders: ' + (p.generation[0] === p.generation[1] ? p.generation[0] : p.generation[0] + ' to ' + p.generation[1] + ', by different paths') + chip('∑') + '</p>');
    p.unions.forEach(function (uid) { var u = C.unions[uid]; if (u && u.close) h.push('<p>Kinship with ' + esc(nameOf(u.a === id ? u.b : u.a)) + ': φ = ' + (+u.phi).toFixed(4) + chip('∑') + '</p>'); });
    if (p.move) h.push('<p>Thread moves' + (p.move.estimated ? ' (year not in the data, drawn dotted)' : ' ' + p.move.year) + ': ' + esc(p.move.why) + chip(p.move.estimated ? '≈' : p.move.grade || '∑') + '</p>');
    if (p.why) h.push('<p>Dashed: ' + esc(p.why) + '</p>');
    card.innerHTML = h.join(''); card.hidden = false;
    card.querySelector('.x').onclick = clearPick;
    card.querySelectorAll('a[data-p]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); pick(a.dataset.p); }; });
  }

  // ---- the ladder (report 07, where cheap): 1 cloth, 2 loom (wide), 3 fell, 4 Europe (the arrows), 5-6 later, 7 a person, 8 a fiber
  function stopIndexOf(def) { for (var i = 0; i < C.stops.length; i++) if (C.stops[i].def_ === def) return i; return -1; }
  function personView(id) {
    var p = C.people[id], sc = browser.currentScene, vp = sc.createNode('Viewpoint'), Y = function (yr) { return (yr - C.layout.Y0) * C.layout.TY; };
    var pc = p.pieces[p.pieces.length - 1], y0 = Y(p.born), y1 = Y(p.died == null ? p.born + 60 : p.died), d = Math.max(5, (y1 - y0) * 1.5);
    vp.position = new X3D.SFVec3f(pc[1] + 0.8, (y0 + y1) / 2, pc[2] + d); vp.centerOfRotation = new X3D.SFVec3f(pc[1], (y0 + y1) / 2, pc[2]); vp.description = p.label;
    sc.addRootNode(vp); vp.set_bind = true;
  }
  function ladder(k) {
    var t = C.ladder[k];
    if (t === null || t === undefined) { toast('rung ' + k + ' (' + ['', '', '', '', '', 'Frankfurt', 'the lane'][k] + ') is not built: lazy, later (report 07)'); return; }
    if (t === 'fell') { $('fell').focus(); fellEvents(); return; }
    if (t === 'person') { if (A.picked) personView(A.picked); else toast('pick a thread first'); return; }
    if (t === 'fiber') { if (A.picked) { showCard(A.picked); var a = $('card').querySelector('ul a'); if (a) a.focus(); else toast('no source line for this record'); } else toast('pick a thread first'); return; }
    var i = stopIndexOf(t); if (i >= 0) { stopTour(); bindStop(i); }
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || !C) return;
    var k = e.key;
    if (/^[1-8]$/.test(k) && e.target.tagName !== 'INPUT') { ladder(k); return; }
    if (k === 't' || k === 'T') { toggleTour(); return; }
    if (k === 'ArrowRight' && e.target.tagName !== 'INPUT') { stopTour(); step(1); return; }
    if (k === 'ArrowLeft' && e.target.tagName !== 'INPUT') { stopTour(); step(-1); return; }
    if (k === '[' || k === ']') { setFell(A.fell + (k === ']' ? 1 : -1)); return; }
    if (k === '{' || k === '}') { setFell(A.fell + (k === '}' ? 25 : -25)); return; }
    if (k === 'Escape') { clearPick(); stopTour(); }
  });
  addEventListener('resize', function () {
    if (!C || A.stop < 0) return;
    if ((phoneView() ? 'phone' : 'desktop') !== A.view) { bindStop(A.stop); return; }
    var st = C.stops[A.stop], vp = node(st.def_); if (A.view === 'desktop' && vp) fitFov(vp, st);
  });
  A.bindStop = bindStop; A.pick = pick; A.clear = clearPick; A.setFell = setFell; A.loadFamily = loadFamily; A.ladder = ladder; A.nearest = nearest;
})();
</script>
